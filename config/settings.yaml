    crop_category: "Cereal"
    gbif_taxon_key: 2569259
    typical_seasons: ["Kharif (Jun-Nov)", "Rabi (Nov-Apr)"]
    favorable_weather:
      temp_min_c: 20.0
      temp_max_c: 30.0
      rh_min_pct: 85.0
      rainfall_sensitive: true

