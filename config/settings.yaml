# Regional weather representative coordinates (Indian Agricultural Hubs)
weather_regions:
  national_composite:
    name: "India National Composite"
    latitude: 22.5937
    longitude: 78.9629
    description: "Centroid of Indian agricultural landmass"
  punjab_haryana:
    name: "Northwest Indo-Gangetic Plains (Wheat/Rice Hub)"
    latitude: 30.7333
    longitude: 76.7794
    description: "Major cereal breadbasket (Punjab & Haryana)"
  odisha_bengal:
    name: "Eastern Coastal Rice Belt (Rice Research Zone)"
    latitude: 20.4625
    longitude: 85.8830
    description: "High rainfall Kharif rice belt (Cuttack NRRI & Bengal)"
  tamil_nadu:
    name: "Southern Agricultural Zone (Rice/Pulses/Cotton)"
    latitude: 11.1271
    longitude: 78.6569
    description: "Tamil Nadu & South Deccan plateau"
  maharashtra:
    name: "Western/Central Semi-Arid Zone (Pulses/Cotton/Soybean)"
    latitude: 19.7515
    longitude: 75.7139
    description: "Maharashtra & Central India pulse belt"

# Data collection parameters
data_collection:
  start_year: 2015
  end_year: 2026
  target_country: "IN"
  gbif_base_url: "https://api.gbif.org/v1/occurrence/search"
  nasa_power_base_url: "https://power.larc.nasa.gov/api/temporal/monthly/point"
  timeout_seconds: 25
  max_retries: 3
  backoff_factor: 1.5

# Time Series & Forecasting Configuration
time_series:
  frequency: "MS"  # Month Start
  target_variable: "documented_occurrence_count"
  seasonal_period: 12
  min_observations_for_sarima: 24
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  default_forecast_horizon: 6

forecasting:
  classical_models:
    - "seasonal_naive"
    - "ar"
    - "ma"
    - "arma"
    - "arima"
    - "sarima"
    - "holt_winters"
    - "arimax"
    - "sarimax"
  modern_models:
    - "prophet"
    - "autots"
    - "random_forest_autoregressor"
    - "gradient_boosting_autoregressor"
