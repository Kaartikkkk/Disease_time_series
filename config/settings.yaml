# Central Configuration for Plant Disease Outbreak Forecasting for India
project:
  name: "Plant Disease Outbreak Forecasting Using Time-Series Analysis (India)"
  version: "2.0.0"
  country: "India"
  country_code: "IN"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  reports_dir: "data/reports"
  models_dir: "models"
  logs_dir: "logs"

# Candidate plant pathogens and diseases for Indian agriculture
pathogens:
